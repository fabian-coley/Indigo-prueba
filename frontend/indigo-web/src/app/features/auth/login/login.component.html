<main class="login__main">
  <mat-card class="login__card" appearance="outlined">
    <div class="login__brand">
      <span class="login__logo" aria-hidden="true">I</span>
      <span class="login__brand-name">Indigo</span>
    </div>

    <h1 class="login__title">Ingresar</h1>
    <p class="login__subtitle">Gestión de productos y ventas</p>

    @if (errorMessage(); as mensaje) {
      <div class="login__alert" role="alert">
        <mat-icon class="login__alert-icon" aria-hidden="true">error_outline</mat-icon>
        <span>{{ mensaje }}</span>
      </div>
    }

    <form class="login__form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <mat-form-field appearance="outline" class="login__field">
        <mat-label>Email</mat-label>
        <mat-icon matPrefix aria-hidden="true">mail_outline</mat-icon>
        <input
          matInput
          type="email"
          formControlName="email"
          autocomplete="username"
          placeholder="usuario@indigo.com"
        />
        @if (fieldMessage('email'); as mensaje) {
          <mat-error>{{ mensaje }}</mat-error>
        }
      </mat-form-field>

      <mat-form-field appearance="outline" class="login__field">
        <mat-label>Contraseña</mat-label>
        <mat-icon matPrefix aria-hidden="true">lock_outline</mat-icon>
        <input
          matInput
          [type]="mostrarPassword() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password"
        />
        <button
          mat-icon-button
          matSuffix
          type="button"
          [attr.aria-label]="mostrarPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          (click)="mostrarPassword.set(!mostrarPassword())"
        >
          <mat-icon>{{ mostrarPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        @if (fieldMessage('password'); as mensaje) {
          <mat-error>{{ mensaje }}</mat-error>
        }
      </mat-form-field>

      <button
        mat-flat-button
        color="primary"
        type="submit"
        class="login__submit"
        [disabled]="loading()"
      >
        @if (loading()) {
          <mat-progress-spinner class="login__spinner" mode="indeterminate" [diameter]="18" />
          <span>Ingresando…</span>
        } @else {
          <span>Ingresar</span>
        }
      </button>
    </form>

    <div class="login__demo">
      <span class="login__demo-title">Credenciales de demo</span>
      <div class="login__demo-buttons">
        <button mat-stroked-button type="button" (click)="usarCredencialesDemo('admin')">
          Admin · admin&#64;indigo.com
        </button>
        <button mat-stroked-button type="button" (click)="usarCredencialesDemo('vendedor')">
          Vendedor · vendedor&#64;indigo.com
        </button>
      </div>
    </div>
  </mat-card>
</main>
